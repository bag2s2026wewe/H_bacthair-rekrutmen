<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0f766e">
<title>Portal Rekrutmen RSUD — 250 Fitur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--rs-dark:#0f766e;--rs-deep:#115e59;--rs-green:#14b8a6;--rs-mint:#ccfbf1;--rs-soft:#f8fafc;--rs-ink:#1e293b;--rs-muted:#64748b;--rs-line:#e2e8f0;--rs-gold:#f4b942;--rs-shadow:0 18px 42px rgba(15,118,110,.10);--rs-bg:#f8fafc;--rs-card:rgba(255,255,255,.92);--rs-text:#1e293b;}
[data-theme="dark"]{--rs-soft:#0f172a;--rs-ink:#e2e8f0;--rs-muted:#94a3b8;--rs-line:#334155;--rs-bg:#0b1220;--rs-card:rgba(30,41,59,.85);--rs-text:#e2e8f0;}
*{letter-spacing:0;box-sizing:border-box;}
body{font-family:"Inter",sans-serif;background:var(--rs-bg);color:var(--rs-text);margin:0;transition:background .3s,color .3s;}
a{transition:all .18s;cursor:pointer;}
.touch-ripple{position:relative;overflow:hidden;isolation:isolate;}
.touch-ripple .ripple-dot{position:absolute;left:var(--ripple-x);top:var(--ripple-y);width:14px;height:14px;border-radius:999px;background:rgba(255,255,255,.55);pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:ripple-pop .58s ease-out forwards;}
.touch-press{transition:transform .18s;}
.touch-press:active{transform:translateY(1px) scale(.985);}
@keyframes ripple-pop{0%{opacity:.9;transform:translate(-50%,-50%) scale(0);}100%{opacity:0;transform:translate(-50%,-50%) scale(22);}}
.public-navbar{background:var(--rs-card);border-bottom:1px solid var(--rs-line);box-shadow:0 12px 30px rgba(15,23,42,.06);backdrop-filter:blur(14px);position:sticky;top:0;z-index:1030;}
.public-brand{display:flex;align-items:center;gap:12px;color:var(--rs-text);text-decoration:none;}
.public-brand span{display:grid;gap:1px;}
.public-brand strong{color:var(--rs-deep);font-size:15px;line-height:1.15;}
[data-theme="dark"] .public-brand strong{color:#5eead4;}
.public-brand small{color:var(--rs-muted);font-size:12px;font-weight:700;}
.navbar-light .navbar-nav .nav-link{color:#475569;font-weight:600;font-size:13px;cursor:pointer;padding:6px 10px!important;}
[data-theme="dark"] .navbar-light .navbar-nav .nav-link{color:#cbd5e1;}
.navbar-light .navbar-nav .nav-link:hover{color:var(--rs-dark);}
.navbar-brand img,.brand img,.auth-card img{object-fit:contain;background:#fff;border-radius:8px;padding:3px;box-shadow:0 12px 28px rgba(6,59,49,.18);}
.hero{min-height:600px;background:linear-gradient(105deg,rgba(248,250,252,.96) 0%,rgba(248,250,252,.90) 45%,rgba(248,250,252,.55) 100%);display:flex;align-items:center;position:relative;overflow:hidden;}
[data-theme="dark"] .hero{background:linear-gradient(105deg,rgba(11,18,32,.96) 0%,rgba(11,18,32,.90) 45%,rgba(11,18,32,.55) 100%);}
.hero::before{content:"";position:absolute;top:0;right:0;width:55%;height:100%;background-size:cover;background-position:center;opacity:.28;pointer-events:none;}
.hero .container{position:relative;z-index:1;}
.hero h1{max-width:780px;line-height:1.06;}
.hero-kicker,.section-kicker{display:inline-flex;align-items:center;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase;}
.hero-kicker{color:var(--rs-dark);background:rgba(204,251,241,.72);padding:8px 12px;}
[data-theme="dark"] .hero-kicker{color:#5eead4;background:rgba(15,118,110,.25);}
.section-kicker{color:var(--rs-dark);background:var(--rs-mint);padding:7px 11px;margin-bottom:12px;}
[data-theme="dark"] .section-kicker{color:#5eead4;background:rgba(15,118,110,.25);}
.hero-panel{border:1px solid var(--rs-line);border-radius:16px;padding:28px;background:var(--rs-card);box-shadow:0 24px 65px rgba(15,23,42,.12);backdrop-filter:blur(18px);}
.hero-panel h3{margin:18px 0 8px;font-weight:800;}
.mini-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:24px;}
.mini-stat-grid div{background:var(--rs-soft);border:1px solid var(--rs-line);border-radius:14px;padding:16px;}
.mini-stat-grid strong{display:block;font-size:30px;line-height:1;color:var(--rs-text);}
.mini-stat-grid small{color:var(--rs-muted);}
.section{padding:70px 0;}
.site-main{overflow:hidden;}
.hero-search{display:grid;grid-template-columns:1fr auto;gap:10px;width:min(760px,100%);padding:10px;border:1px solid var(--rs-line);border-radius:16px;background:var(--rs-card);}
.hero-search input{min-width:0;border:0;outline:none;padding:12px;background:transparent;color:var(--rs-text);font-weight:600;}
.hero-shortcuts{display:flex;flex-wrap:wrap;gap:10px;}
.hero-shortcuts button{border:1px solid var(--rs-line);border-radius:999px;padding:8px 13px;background:var(--rs-card);color:var(--rs-dark);font-size:13px;font-weight:750;cursor:pointer;}
[data-theme="dark"] .hero-shortcuts button{color:#5eead4;}
.hero-shortcuts button:hover,.hero-shortcuts button.is-active{border-color:var(--rs-dark);background:var(--rs-dark);color:#fff;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat-metric{display:grid;gap:7px;}
.stat-metric span{width:fit-content;border-radius:999px;padding:6px 10px;background:var(--rs-mint);color:var(--rs-dark);font-size:12px;font-weight:850;}
[data-theme="dark"] .stat-metric span{color:#5eead4;background:rgba(15,118,110,.25);}
.stat-metric strong{color:var(--rs-deep);font-size:42px;line-height:1;font-weight:800;}
[data-theme="dark"] .stat-metric strong{color:#5eead4;}
.stat-metric p{margin:0;color:var(--rs-muted);font-weight:700;}
.job-filter{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(160px,1fr));gap:14px;align-items:end;border:1px solid var(--rs-line);border-radius:16px;padding:18px;background:var(--rs-card);}
.job-card{display:grid;gap:14px;border:1px solid var(--rs-line);border-radius:16px;padding:22px;background:var(--rs-card);transition:all .18s;}
.job-card:hover{transform:translateY(-4px);border-color:rgba(15,118,110,.42);box-shadow:0 24px 54px rgba(15,118,110,.14);}
.job-badge{border-radius:999px;padding:6px 10px;background:var(--rs-dark);color:#fff;font-size:12px;font-weight:850;}
.job-card h3{margin:0;color:var(--rs-text);font-size:20px;font-weight:850;}
.job-unit{margin:-6px 0 0;color:var(--rs-muted);font-weight:700;}
.job-meta{display:grid;gap:8px;margin:0;}
.job-meta div{display:grid;grid-template-columns:120px 1fr;gap:12px;}
.job-meta dt{color:var(--rs-muted);font-size:12px;font-weight:800;text-transform:uppercase;}
.job-meta dd{margin:0;color:var(--rs-text);font-weight:700;}
.requirement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.requirement-item{display:flex;align-items:center;gap:10px;border:1px solid var(--rs-line);border-radius:14px;padding:14px;background:var(--rs-card);font-weight:750;color:var(--rs-text);}
.requirement-item span{width:11px;height:11px;border-radius:999px;background:var(--rs-green);box-shadow:0 0 0 5px rgba(20,184,166,.12);}
.announcement-card{display:grid;gap:10px;border:1px solid var(--rs-line);border-radius:16px;padding:22px;background:var(--rs-card);}
.announcement-card h3{margin:0;color:var(--rs-deep);font-size:19px;font-weight:850;}
[data-theme="dark"] .announcement-card h3{color:#5eead4;}
.announcement-card p{color:var(--rs-muted);}
.announcement-card a{color:var(--rs-dark);font-weight:850;text-decoration:none;}
[data-theme="dark"] .announcement-card a{color:#5eead4;}
.about-image{width:100%;min-height:340px;max-height:440px;object-fit:cover;border-radius:16px;}
.value-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
.value-list span{border:1px solid var(--rs-line);border-radius:999px;padding:9px 13px;background:var(--rs-soft);color:var(--rs-dark);font-weight:800;}
[data-theme="dark"] .value-list span{color:#5eead4;}
.faq-accordion .accordion-item{border:1px solid var(--rs-line);border-radius:14px;margin-bottom:12px;background:var(--rs-card);}
.faq-accordion .accordion-button{font-weight:800;background:var(--rs-card);color:var(--rs-text);}
.faq-accordion .accordion-body{background:var(--rs-card);color:var(--rs-text);}
.site-footer{padding:56px 0 24px;background:#0f172a;color:rgba(255,255,255,.82);}
.footer-grid{display:grid;grid-template-columns:1.4fr .8fr 1fr;gap:34px;}
.site-footer h3,.site-footer h4{color:#fff;font-weight:850;}
.site-footer a{display:block;width:fit-content;margin:8px 0;color:rgba(255,255,255,.78);text-decoration:none;}
.site-footer a:hover{color:#fff;}
.footer-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.62);font-size:13px;}
.stat-card,.dashboard-card{background:var(--rs-card);border:1px solid var(--rs-line);border-radius:16px;box-shadow:var(--rs-shadow);color:var(--rs-text);}
.stat-card h3,.dashboard-card h3{color:var(--rs-dark);font-weight:850;}
[data-theme="dark"] .dashboard-card h3{color:#5eead4;}
.applicant-stat{display:grid;gap:7px;min-height:130px;}
.applicant-stat small{color:var(--rs-muted);font-weight:800;text-transform:uppercase;}
.applicant-stat h4{margin:0;color:var(--rs-deep);font-size:32px;font-weight:850;}
[data-theme="dark"] .applicant-stat h4{color:#5eead4;}
.applicant-stat span{color:var(--rs-muted);font-size:13px;font-weight:700;}
.btn{border-radius:10px;font-weight:700;min-height:42px;}
.btn-rs{background:var(--rs-green);border-color:var(--rs-green);color:#fff;box-shadow:0 10px 22px rgba(34,166,111,.24);}
.btn-rs:hover{background:var(--rs-dark);border-color:var(--rs-dark);color:#fff;transform:translateY(-1px);}
.btn-outline-success{--bs-btn-color:var(--rs-dark);--bs-btn-border-color:rgba(7,85,59,.35);--bs-btn-hover-bg:var(--rs-dark);--bs-btn-hover-border-color:var(--rs-dark);}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:32px 0;background:radial-gradient(circle at top left,rgba(34,166,111,.22),transparent 30%),linear-gradient(135deg,var(--rs-soft),var(--rs-bg));}
.auth-card{width:min(540px,calc(100% - 32px));background:var(--rs-card);border:1px solid var(--rs-line);border-radius:8px;padding:34px;box-shadow:0 28px 80px rgba(7,85,59,.16);}
.form-label{color:var(--rs-text);font-weight:700;}
.form-control,.form-select{border-color:var(--rs-line);border-radius:8px;min-height:44px;background:var(--rs-bg);color:var(--rs-text);}
[data-theme="dark"] .form-control,[data-theme="dark"] .form-select{background:#0b1220;color:var(--rs-text);}
.form-control:focus,.form-select:focus{border-color:var(--rs-green);box-shadow:0 0 0 .2rem rgba(34,166,111,.16);background:var(--rs-bg);color:var(--rs-text);}
.password-field{position:relative;}
.password-field .form-control{padding-right:92px;}
.password-toggle{position:absolute;top:50%;right:8px;transform:translateY(-50%);min-width:72px;border:0;border-radius:8px;padding:6px 10px;background:var(--rs-mint);color:var(--rs-dark);font-size:12px;font-weight:800;}
[data-theme="dark"] .password-toggle{background:rgba(15,118,110,.25);color:#5eead4;}
.app-layout{min-height:100vh;display:grid;grid-template-columns:280px 1fr;background:var(--rs-bg);}
.sidebar{color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(135deg,rgba(34,166,111,.16),rgba(255,255,255,0)),var(--rs-deep);}
.brand{color:#fff;text-decoration:none;display:flex;align-items:center;gap:12px;font-weight:800;margin-bottom:24px;cursor:pointer;}
.brand img{width:46px;height:46px;}
.sidebar-menu{display:grid;gap:6px;}
.sidebar-menu a{color:rgba(255,255,255,.88);text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid transparent;cursor:pointer;}
.sidebar-menu a:hover,.sidebar-menu .logout{background:rgba(255,255,255,.13);color:#fff;}
.sidebar-menu a.active{background:rgba(255,255,255,.20);}
.sidebar-badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;border-radius:999px;background:var(--rs-gold);color:#2f2200;font-size:12px;font-weight:850;}
.notification-bell{position:fixed;top:18px;right:24px;z-index:1080;}
.notification-bell summary{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border:1px solid var(--rs-line);border-radius:999px;background:var(--rs-card);color:var(--rs-dark);cursor:pointer;list-style:none;}
[data-theme="dark"] .notification-bell summary{color:#5eead4;}
.notification-bell summary::-webkit-details-marker{display:none;}
.bell-count{position:absolute;top:-4px;right:-4px;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border:2px solid var(--rs-bg);border-radius:999px;background:#dc3545;color:#fff;font-size:11px;font-weight:850;}
.notification-popover{position:absolute;top:calc(100% + 12px);right:0;width:min(380px,calc(100vw - 28px));max-height:min(620px,calc(100vh - 92px));overflow:auto;border:1px solid var(--rs-line);border-radius:8px;background:var(--rs-card);box-shadow:0 26px 70px rgba(7,85,59,.22);}
.notification-popover-head{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid var(--rs-line);}
.notification-popover-item{display:grid;gap:7px;padding:14px;border-bottom:1px solid var(--rs-line);}
.notification-popover-item.is-unread{background:linear-gradient(90deg,rgba(223,247,235,.86),transparent);}
[data-theme="dark"] .notification-popover-item.is-unread{background:linear-gradient(90deg,rgba(15,118,110,.25),transparent);}
.notification-popover-item h6{margin:0;color:var(--rs-deep);font-weight:850;}
[data-theme="dark"] .notification-popover-item h6{color:#5eead4;}
.notification-popover-item p{color:var(--rs-muted);font-size:13px;margin:0;}
.notification-popover-link{display:block;padding:13px 16px;color:var(--rs-dark);font-weight:850;text-align:center;background:var(--rs-soft);}
[data-theme="dark"] .notification-popover-link{color:#5eead4;}
.main-content{min-width:0;padding:30px;background:var(--rs-bg);}
.page-title{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px;background:var(--rs-card);border:1px solid var(--rs-line);border-radius:8px;padding:20px;box-shadow:var(--rs-shadow);flex-wrap:wrap;}
.page-title h2{margin:0;font-weight:850;color:var(--rs-dark);}
[data-theme="dark"] .page-title h2{color:#5eead4;}
.status-pill{display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--rs-mint);color:var(--rs-dark);font-size:12px;font-weight:800;}
[data-theme="dark"] .status-pill{color:#5eead4;background:rgba(15,118,110,.25);}
.table{vertical-align:middle;color:var(--rs-text);}
.table > :not(caption) > * > *{padding:.7rem .6rem;}
.table thead th{color:var(--rs-text);border-bottom-color:var(--rs-line);font-size:12px;text-transform:uppercase;background:transparent;}
.verification-form{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:8px;min-width:260px;}
.exam-question-head{display:grid;grid-template-columns:42px 1fr;gap:14px;margin-bottom:18px;}
.exam-number{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;background:var(--rs-deep);color:#fff;font-weight:850;line-height:1;}
.exam-number.small{width:30px;height:30px;font-size:12px;}
.exam-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.exam-option{display:grid;grid-template-columns:18px 34px 1fr;gap:12px;padding:14px;border:1px solid var(--rs-line);border-radius:8px;background:var(--rs-card);cursor:pointer;}
.exam-option:has(input:checked){border-color:rgba(34,166,111,.62);background:var(--rs-mint);}
[data-theme="dark"] .exam-option:has(input:checked){background:rgba(15,118,110,.25);}
.option-code{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--rs-mint);color:var(--rs-dark);font-weight:850;}
[data-theme="dark"] .option-code{color:#5eead4;background:rgba(15,118,110,.4);}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.feature-tile{background:var(--rs-card);border:1px solid var(--rs-line);border-radius:12px;padding:16px;cursor:pointer;transition:all .18s;display:grid;gap:8px;position:relative;overflow:hidden;}
.feature-tile:hover{transform:translateY(-3px);border-color:var(--rs-green);box-shadow:0 18px 42px rgba(15,118,110,.14);}
.feature-tile .ft-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--rs-green),var(--rs-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;}
.feature-tile h6{margin:0;color:var(--rs-text);font-weight:850;font-size:13px;}
.feature-tile p{margin:0;color:var(--rs-muted);font-size:11px;line-height:1.4;}
.feature-tile .ft-badge{position:absolute;top:8px;right:8px;background:var(--rs-gold);color:#2f2200;font-size:9px;font-weight:850;padding:2px 6px;border-radius:999px;}
.feature-cat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:850;text-transform:uppercase;color:var(--rs-dark);background:var(--rs-mint);padding:4px 10px;border-radius:999px;margin-bottom:14px;}
[data-theme="dark"] .feature-cat{color:#5eead4;background:rgba(15,118,110,.25);}
.global-search-panel{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:3000;display:none;align-items:flex-start;justify-content:center;padding-top:80px;}
.global-search-panel.open{display:flex;}
.gsp-box{background:var(--rs-card);border-radius:16px;width:min(680px,calc(100% - 32px));max-height:70vh;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.35);}
.gsp-input{border:0;width:100%;padding:20px;font-size:18px;background:transparent;color:var(--rs-text);outline:none;border-bottom:1px solid var(--rs-line);}
.gsp-results{max-height:calc(70vh - 70px);overflow-y:auto;}
.gsp-item{padding:14px 20px;border-bottom:1px solid var(--rs-line);cursor:pointer;display:flex;gap:12px;align-items:center;}
.gsp-item:hover{background:var(--rs-soft);}
.gsp-item strong{display:block;color:var(--rs-text);font-weight:700;}
.gsp-item small{color:var(--rs-muted);}
.back-to-top{position:fixed;bottom:100px;right:24px;width:48px;height:48px;border-radius:50%;background:var(--rs-dark);color:#fff;border:0;box-shadow:0 12px 30px rgba(15,118,110,.35);display:none;align-items:center;justify-content:center;z-index:900;cursor:pointer;font-size:20px;}
.back-to-top.show{display:flex;}
.chat-widget{position:fixed;bottom:24px;right:24px;z-index:950;}
.chat-toggle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--rs-green),var(--rs-dark));color:#fff;border:0;box-shadow:0 14px 34px rgba(15,118,110,.4);font-size:24px;cursor:pointer;}
.chat-panel{position:absolute;bottom:70px;right:0;width:min(340px,calc(100vw - 32px));background:var(--rs-card);border:1px solid var(--rs-line);border-radius:16px;display:none;overflow:hidden;}
.chat-panel.open{display:block;}
.chat-head{padding:14px 16px;background:var(--rs-dark);color:#fff;font-weight:800;display:flex;justify-content:space-between;}
.chat-body{padding:14px;display:grid;gap:10px;max-height:340px;overflow-y:auto;}
.chat-msg{background:var(--rs-soft);padding:10px;border-radius:10px;font-size:13px;color:var(--rs-text);}
[data-theme="dark"] .chat-msg{background:rgba(30,41,59,.7);}
.chat-msg.is-me{background:var(--rs-mint);margin-left:auto;max-width:85%;}
[data-theme="dark"] .chat-msg.is-me{background:rgba(15,118,110,.35);}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--rs-line);}
.chat-input input{flex:1;border:1px solid var(--rs-line);border-radius:8px;padding:8px;background:var(--rs-bg);color:var(--rs-text);}
.theme-toggle,.lang-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--rs-line);background:var(--rs-card);color:var(--rs-text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;}
.theme-toggle:hover,.lang-toggle:hover{background:var(--rs-dark);color:#fff;}
.kbd{background:var(--rs-soft);border:1px solid var(--rs-line);border-radius:4px;padding:2px 6px;font-size:11px;font-family:monospace;color:var(--rs-text);}
.bookmark-btn{cursor:pointer;color:var(--rs-muted);font-size:20px;}
.bookmark-btn.active{color:var(--rs-gold);}
.breadcrumb-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--rs-muted);flex-wrap:wrap;}
.breadcrumb-bar a{color:var(--rs-dark);text-decoration:none;cursor:pointer;}
[data-theme="dark"] .breadcrumb-bar a{color:#5eead4;}
.timeline-wrap{position:relative;padding-left:26px;}
.timeline-wrap::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--rs-line);}
.timeline-item{position:relative;margin-bottom:16px;}
.timeline-item::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--rs-green);border:2px solid var(--rs-bg);}
.progress-circle{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rs-green) var(--p),var(--rs-line) 0);position:relative;margin:0 auto;}
.progress-circle::after{content:"";position:absolute;inset:10px;background:var(--rs-card);border-radius:50%;}
.progress-circle span{position:relative;z-index:1;font-size:22px;font-weight:850;color:var(--rs-dark);}
[data-theme="dark"] .progress-circle span{color:#5eead4;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--rs-soft);border:1px solid var(--rs-line);font-size:11px;font-weight:700;color:var(--rs-text);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1040;}
.sidebar-backdrop.show{display:block;}
.sidebar-toggle-btn{display:none;background:transparent;border:0;color:var(--rs-text);font-size:24px;cursor:pointer;position:absolute;top:12px;left:12px;z-index:10;}
.video-cv-box{aspect-ratio:16/9;background:#000;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:48px;}
.tile-dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.tile-stat{background:var(--rs-card);border:1px solid var(--rs-line);border-radius:12px;padding:14px;text-align:center;}
.tile-stat strong{display:block;font-size:24px;color:var(--rs-dark);font-weight:850;}
[data-theme="dark"] .tile-stat strong{color:#5eead4;}
.tile-stat small{color:var(--rs-muted);font-size:11px;}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.kanban-col{background:var(--rs-soft);border-radius:10px;padding:12px;min-height:200px;}
.kanban-col h6{color:var(--rs-dark);font-weight:850;margin-bottom:10px;}
[data-theme="dark"] .kanban-col h6{color:#5eead4;}
.kanban-card{background:var(--rs-card);border:1px solid var(--rs-line);border-radius:8px;padding:10px;margin-bottom:8px;font-size:12px;color:var(--rs-text);}
@media (max-width:900px){
  .app-layout{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:-300px;top:0;bottom:0;width:280px;z-index:1050;transition:left .3s;height:100vh;}
  .sidebar.open{left:0;}
  .sidebar-toggle-btn{display:inline-flex;}
  .main-content{padding:20px;padding-top:64px;}
  .notification-bell{top:14px;right:14px;}
  .hero{min-height:auto;padding:60px 0 80px;}
  .hero::before{width:100%;opacity:.18;}
  .hero h1{font-size:34px;}
  .section{padding:50px 0;}
  .exam-options,.stats-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .job-filter{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr;}
  .feature-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
}
@media (max-width:576px){
  .hero h1{font-size:28px;}
  .hero-panel,.auth-card{padding:22px;}
  .mini-stat-grid{grid-template-columns:1fr;}
  .exam-question-head{grid-template-columns:1fr;}
  .hero-search{grid-template-columns:1fr;}
  .requirement-grid{grid-template-columns:1fr;}
  .verification-form{grid-template-columns:1fr;min-width:0;}
}
.hidden{display:none!important;}
</style>

function closeLayout(){return '</div></div>';}
function bellMarkup(unread){
  const p=DB.data.pelamar.find(x=>x.user_id===State.user.id);if(!p)return '';
  const list=DB.data.notifikasi.filter(n=>n.pelamar_id===p.id).sort((a,b)=>{if(a.is_read!==b.is_read)return a.is_read-b.is_read;return (b.created_at||'').localeCompare(a.created_at||'');}).slice(0,8);
  return `<details class="notification-bell">
    <summary><span>🔔</span>${unread>0?`<span class="bell-count">${unread}</span>`:''}</summary>
    <div class="notification-popover">
      <div class="notification-popover-head"><strong>Notifikasi</strong><small>${unread} baru</small></div>
      ${list.length?list.map(n=>`<div class="notification-popover-item ${n.is_read?'is-read':'is-unread'}">
        <h6>${e(n.judul)}</h6><p>${e(n.pesan)}</p><small>${e(n.created_at)}</small>
        ${!n.is_read?`<button class="btn btn-sm btn-outline-success mt-2" onclick="markRead(${n.id})">Tandai</button>`:''}
      </div>`).join(''):'<div class="notification-popover-item"><p class="text-muted mb-0">Belum ada</p></div>'}
      <a class="notification-popover-link" onclick="go('pelamar-lamaran')">Lihat Lamaran</a>
    </div>
  </details>`;
}

function toast(){
  const f=consumeFlash();if(!f)return '';
  setTimeout(()=>{const el=$('#flashToast');if(el)el.remove();},3800);
  return `<div id="flashToast" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000"><div class="toast show align-items-center text-bg-${f.type} border-0"><div class="d-flex"><div class="toast-body">${e(f.msg)}</div><button class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast-container').remove()"></button></div></div></div>`;
}
function toastInfo(msg){
  const c=document.createElement('div');c.className='toast-container position-fixed bottom-0 end-0 p-3';c.style.zIndex='2100';
  c.innerHTML=`<div class="toast show align-items-center text-bg-dark border-0"><div class="d-flex"><div class="toast-body">${e(msg)}</div><button class="btn-close btn-close-white me-2 m-auto"></button></div></div>`;
  document.body.appendChild(c);c.querySelector('.btn-close').onclick=()=>c.remove();setTimeout(()=>c.remove(),3500);
}
window.toastInfo=toastInfo;

function checkStrength(inp){
  const v=inp.value;const el=$('#pwdStrength');if(!el)return;
  let s=0;if(v.length>=8)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  const labels=['Lemah','Sedang','Kuat','Sangat Kuat'];const colors=['#dc3545','#f4b942','#14b8a6','#0f766e'];
  el.textContent='Kekuatan: '+labels[Math.min(s,3)];el.style.color=colors[Math.min(s,3)];
}

function viewCalendar(){
  const now=new Date();const y=now.getFullYear();const m=now.getMonth();
  const days=new Date(y,m+1,0).getDate();
  const first=new Date(y,m,1).getDay();
  const events=[{day:5,label:'Webinar'},{day:12,label:'Job Fair'},{day:20,label:'Interview'}];
  let html='';
  for(let i=0;i<first;i++)html+='<div></div>';
  for(let d=1;d<=days;d++){
    const ev=events.find(x=>x.day===d);
    html+=`<div style="border:1px solid var(--rs-line);border-radius:6px;padding:6px;min-height:60px;${ev?'background:var(--rs-mint)':''}"><strong>${d}</strong>${ev?`<br><small>${ev.label}</small>`:''}</div>`;
  }
  return `${State.user?sidebar('calendar'):publicNavbar()}
    <main class="main-content" ${!State.user?'style="background:var(--rs-bg)"':''}>
      ${!State.user?'<div class="container py-5">':''}
      <div class="page-title"><h2>📅 Calendar ${now.toLocaleString('id-ID',{month:'long',year:'numeric'})}</h2></div>
      <div class="dashboard-card p-4">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">
          <div><strong>Min</strong></div><div><strong>Sen</strong></div><div><strong>Sel</strong></div><div><strong>Rab</strong></div><div><strong>Kam</strong></div><div><strong>Jum</strong></div><div><strong>Sab</strong></div>
          ${html}
        </div>
      </div>
      ${!State.user?'</div>':''}
    </main>
    ${State.user?closeLayout():''}
    ${!State.user?footerPublic():''}`;
}

function doLogin(form){
  const em=form.email.value.trim().toLowerCase();const pw=form.password.value;
  const u=DB.data.users.find(x=>x.email.toLowerCase()===em&&x.password===pw);
  if(!u){flash('danger','Email/password salah.');render();return;}
  State.user=u;try{sessionStorage.setItem('rs_user_id',u.id);}catch(err){}
  flash('success',`Selamat datang, ${u.name}!`);go(u.role==='admin'?'admin-dashboard':'pelamar-dashboard');
}
window.doLogin=doLogin;
function doRegister(form){
  const n=form.nama_lengkap.value.trim();const nik=form.nik.value.replace(/\D/g,'');const em=form.email.value.trim().toLowerCase();const hp=form.no_hp.value.trim();const pw=form.password.value;const cf=form.password_confirmation.value;
  if(!n||nik.length!==16||!em||!hp||pw.length<8||pw!==cf){flash('danger','Data tidak valid.');render();return;}
  if(DB.data.users.some(u=>u.email.toLowerCase()===em)||DB.data.pelamar.some(p=>p.nik===nik)){flash('danger','Email/NIK sudah terdaftar.');render();return;}
  const uid=DB.nextId('users');DB.data.users.push({id:uid,name:n,email:em,password:pw,role:'pelamar'});
  const pid=DB.nextId('pelamar');DB.data.pelamar.push({id:pid,user_id:uid,nama_lengkap:n,nik,email:em,no_hp:hp,created_at:nowStr()});
  DB.save();flash('success','Registrasi berhasil.');go('login');
}

function doLamar(id){
  const p=DB.data.pelamar.find(x=>x.user_id===State.user.id);if(!p){flash('danger','Lengkapi profil.');render();return;}
  if(DB.data.lamaran.some(l=>l.pelamar_id===p.id&&l.lowongan_id===id)){flash('warning','Sudah melamar.');render();return;}

}

  const p=DB.data.pelamar.find(x=>x.user_id===State.user.id);if(!p)return;
  ['nama_lengkap','nik','tempat_lahir','tanggal_lahir','jenis_kelamin','alamat','pendidikan_terakhir','jurusan','email','no_hp'].forEach(k=>{if(f[k])p[k]=f[k].value;});

function saveDokumen(f){
  const p=DB.data.pelamar.find(x=>x.user_id===State.user.id);if(!p)return;
  let c=0;
  ['ktp','ijazah','transkrip','cv','str','sertifikat','foto'].forEach(k=>{
    if(f[k]&&f[k].files&&f[k].files[0]){
      const ex=DB.data.dokumen.find(d=>d.pelamar_id===p.id&&d.jenis_dokumen===k);
      if(ex){ex.status_verifikasi='Menunggu';ex.uploaded_at=nowStr();}
      else DB.data.dokumen.push({id:DB.nextId('dokumen'),pelamar_id:p.id,jenis_dokumen:k,file_path:'local',status_verifikasi:'Menunggu',uploaded_at:nowStr()});

    }
  });

function submitUjian(lamaranId){
  const a={};let c=0;
  for(const [n,it] of Object.entries(PERAWAT_QUESTIONS)){
    const s=document.querySelector(`input[name="q${n}"]:checked`);
    if(!s){Swal.fire('Perhatian','Semua soal wajib dijawab.','warning');return;}
    a[n]=s.value;if(s.value===it.a)c++;
  }
  Swal.fire({title:'Kirim?',icon:'question',showCancelButton:true,confirmButtonColor:'#0f766e',confirmButtonText:'Ya',cancelButtonText:'Batal'}).then(r=>{
    if(!r.isConfirmed)return;
    const t=Object.keys(PERAWAT_QUESTIONS).length;
    const sc=Math.round(c/t*10000)/100;
    const ex=DB.data.ujian_lamaran.find(u=>u.lamaran_id===lamaranId);
    const pl={lamaran_id:lamaranId,soal_file:'online',jawaban_json:JSON.stringify(a),total_benar:c,total_soal:t,nilai:sc,status_ujian:'Menunggu Koreksi',submitted_at:nowStr()};
    if(ex)Object.assign(ex,pl);else DB.data.ujian_lamaran.push({id:DB.nextId('ujian_lamaran'),...pl});
    DB.save();flash('success','Jawaban terkirim.');go('pelamar-lamaran');
  });
}

function updateStatusLamaran(id,status){
  const l=DB.data.lamaran.find(x=>x.id===id);if(!l)return;
  const sebelum=l.status_lamaran;l.status_lamaran=status;DB.save();
  if(sebelum!==status){
    const p=DB.data.pelamar.find(x=>x.id===l.pelamar_id);const lw=DB.data.lowongan.find(x=>x.id===l.lowongan_id);
    const map={'Lulus Administrasi':['Lulus Berkas','Selamat! Lulus berkas',`Berkas ${lw.nama_jabatan} lengkap.`],'Lulus Tes':['Lulus Ujian','Selamat! Lulus ujian',`Hasil ujian ${lw.nama_jabatan} lulus.`],'Diterima':['Diterima','Selamat! Diterima',`Lamaran ${lw.nama_jabatan} DITERIMA.`],'Ditolak':['Ditolak','Belum diterima',`Lamaran ${lw.nama_jabatan} belum diterima.`]};
    if(map[status]&&p){const [t,j,m]=map[status];DB.data.notifikasi.push({id:DB.nextId('notifikasi'),pelamar_id:p.id,lamaran_id:id,tipe:t,judul:j,pesan:m,is_read:0,created_at:nowStr()});DB.save();}
  }
  flash('success','Status diperbarui.');render();
}

function openGlobalSearch(){const p=$('#globalSearchPanel');if(!p)return;p.classList.add('open');setTimeout(()=>$('#globalSearchInput')?.focus(),100);runGlobalSearch('');}
window.openGlobalSearch=openGlobalSearch;
function closeGlobalSearch(){$('#globalSearchPanel')?.classList.remove('open');}
window.closeGlobalSearch=closeGlobalSearch;
function runGlobalSearch(q){
  const r=$('#globalSearchResults');if(!r)return;
  const query=(q||'').toLowerCase();
  const items=[];
  FEATURES.filter(f=>!query||f.name.toLowerCase().includes(query)||f.desc.toLowerCase().includes(query)).slice(0,10).forEach(f=>{items.push({type:'Fitur',label:f.name,desc:'#'+f.id+' · '+f.cat,action:()=>{closeGlobalSearch();runFeature(f.id);}});});
  DB.data.lowongan.filter(l=>!query||l.nama_jabatan.toLowerCase().includes(query)).slice(0,5).forEach(l=>{items.push({type:'Lowongan',label:l.nama_jabatan,desc:l.unit_kerja,action:()=>{closeGlobalSearch();go('pelamar-lowongan');}});});
  DB.data.pengumuman.filter(p=>!query||p.judul.toLowerCase().includes(query)).slice(0,5).forEach(p=>{items.push({type:'Pengumuman',label:p.judul,desc:p.tanggal_publish,action:()=>{closeGlobalSearch();go('pelamar-pengumuman');}});});
  r.innerHTML=items.length?items.map((it,i)=>`<div class="gsp-item" onclick="globalSearchClick(${i})"><div style="font-size:20px">${it.type==='Fitur'?'🚀':it.type==='Lowongan'?'💼':'📢'}</div><div><strong>${e(it.label)}</strong><small>${e(it.desc)}</small></div></div>`).join(''):'<div class="gsp-item"><div><strong>Tidak ada hasil</strong></div></div>';
  window._gspItems=items;
}
window.runGlobalSearch=runGlobalSearch;
function globalSearchClick(i){const it=window._gspItems?.[i];if(it)it.action();}
window.globalSearchClick=globalSearchClick;

/* ============================================================
   EXAM TIMER
   ============================================================ */
let examInterval=null;
function startExamTimer(){
  if(examInterval)clearInterval(examInterval);
  const el=$('#examTimer');if(!el)return;
  let t=30*60;
  examInterval=setInterval(()=>{
    t--;
    if(t<0){clearInterval(examInterval);toastInfo('Waktu habis!');return;}
    const m=String(Math.floor(t/60)).padStart(2,'0');
    const s=String(t%60).padStart(2,'0');
    el.textContent=`${m}:${s}`;
    if(t<60)el.style.color='#dc3545';
  },1000);
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  DB.load();
  if(!State.user){try{const uid=parseInt(sessionStorage.getItem('rs_user_id')||'0');if(uid)State.user=DB.data.users.find(u=>u.id===uid)||null;}catch(err){}}
  const route=State.route;
  let view='';
  if(route==='home')view=viewHome();
  else if(route==='login')view=viewLogin();
  else if(route==='register')view=viewRegister();
  else if(route==='fitur')view=viewFiturHub();
  else if(route==='blog')view=viewBlog();
  else if(route==='events')view=viewEvents();
  else if(route==='galeri')view=viewGaleri();
  else if(route==='analytics')view=viewAnalytics();
  else if(route==='calendar')view=viewCalendar();
  else if(route==='kanban')view=viewKanban();
  else if(route==='video-cv')view=State.user&&State.user.role==='pelamar'?viewVideoCV():viewLogin();
  else if(route==='portfolio')view=State.user&&State.user.role==='pelamar'?viewPortfolio():viewLogin();
  else if(route==='achievement')view=State.user&&State.user.role==='pelamar'?viewAchievement():viewLogin();
  else if(route==='leaderboard')view=State.user&&State.user.role==='pelamar'?viewLeaderboard():viewLogin();
  else if(route==='forum')view=State.user&&State.user.role==='pelamar'?viewForum():viewLogin();
  else if(route==='pelamar-dashboard')view=State.user&&State.user.role==='pelamar'?viewPelamarDashboard():viewLogin();
  else if(route==='pelamar-profil')view=State.user&&State.user.role==='pelamar'?viewPelamarProfil():viewLogin();
  else if(route==='pelamar-lowongan')view=State.user&&State.user.role==='pelamar'?viewPelamarLowongan():viewLogin();
  else if(route==='pelamar-lamaran')view=State.user&&State.user.role==='pelamar'?viewPelamarLamaran():viewLogin();
  else if(route==='pelamar-pengumuman')view=State.user&&State.user.role==='pelamar'?viewPelamarPengumuman():viewLogin();
  else if(route==='pelamar-dokumen')view=State.user&&State.user.role==='pelamar'?viewPelamarDokumen():viewLogin();
  else if(route.startsWith('pelamar-ujian-'))view=State.user&&State.user.role==='pelamar'?viewPelamarUjian(parseInt(route.split('-').pop())):viewLogin();
  else if(route==='admin-dashboard')view=State.user&&State.user.role==='admin'?viewAdminDashboard():viewLogin();
  else if(route==='admin-lowongan')view=State.user&&State.user.role==='admin'?viewAdminLowongan():viewLogin();
  else if(route==='admin-pelamar')view=State.user&&State.user.role==='admin'?viewAdminPelamar():viewLogin();
  else if(route==='admin-verifikasi-lamaran')view=State.user&&State.user.role==='admin'?viewAdminVerifikasiLamaran():viewLogin();
  else if(route==='admin-verifikasi-berkas')view=State.user&&State.user.role==='admin'?viewAdminVerifikasiBerkas():viewLogin();
  else if(route.startsWith('admin-verifikasi-berkas-'))view=State.user&&State.user.role==='admin'?viewAdminVerifikasiBerkas(parseInt(route.split('-').pop())):viewLogin();
  else if(route==='admin-pengumuman')view=State.user&&State.user.role==='admin'?viewAdminPengumuman():viewLogin();
  else if(route==='admin-laporan')view=State.user&&State.user.role==='admin'?viewAdminLaporan():viewLogin();
  else view=viewHome();

  $('#app').innerHTML=toast()+view;
  document.documentElement.setAttribute('data-theme',State.theme);
  $$('.lang-toggle').forEach(b=>b.textContent=State.lang.toUpperCase());
  bindRipple();
  if(route.startsWith('pelamar-ujian-')&&!$('#examTimer')?.dataset.done){const t=$('#examTimer');if(t){t.dataset.done='1';startExamTimer();}}else if(examInterval){clearInterval(examInterval);examInterval=null;}
  // Counters
  $$('[data-count]').forEach(el=>{
    const target=Number(el.dataset.count||0);
    let cur=0;const step=Math.max(1,Math.ceil(target/30));
    const t=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(t);}el.textContent=cur;},40);
  });
}
window.render=render;
function bindRipple(){
  document.documentElement.classList.add('js');
  $$('.btn, .sidebar-menu a, .dashboard-card, .exam-option, .job-card, .feature-tile, .tile-stat').forEach(el=>{el.classList.add('touch-press','touch-ripple');});
  document.onpointerdown=(event)=>{
    const target=event.target.closest('.touch-ripple');if(!target)return;
    const rect=target.getBoundingClientRect();
    const dot=document.createElement('span');dot.className='ripple-dot';
    dot.style.setProperty('--ripple-x',(event.clientX-rect.left)+'px');
    dot.style.setProperty('--ripple-y',(event.clientY-rect.top)+'px');
    target.appendChild(dot);setTimeout(()=>dot.remove(),620);
  };
}

/* ============================================================
   SCROLL & KEYBOARD
   ============================================================ */
window.addEventListener('scroll',()=>{const b=$('#backToTop');if(b)b.classList.toggle('show',window.scrollY>300);});
let keyBuffer='';
document.addEventListener('keydown',ev=>{
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();openGlobalSearch();return;}
  if(ev.key==='Escape'){closeGlobalSearch();toggleChat();return;}
  if(ev.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){ev.preventDefault();openGlobalSearch();return;}
  if(ev.key.toLowerCase()==='g'){keyBuffer='g';setTimeout(()=>keyBuffer='',800);return;}
  if(keyBuffer==='g'){if(ev.key.toLowerCase()==='h'){go('home');keyBuffer='';}else if(ev.key.toLowerCase()==='f'){go('fitur');keyBuffer='';}}
});
